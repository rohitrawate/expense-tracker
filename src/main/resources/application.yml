
spring:
  application:
    name: expensetracker

  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: expense_user
    password: expense_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

      flyway:
        enabled: true
        locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO