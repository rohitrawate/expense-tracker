spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: expensetracker

  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: expense_user
    password: expense_password
    driver-class-name: org.postgresql.Driver

#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:schema.sql
#      data-locations: classpath:data.sql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      jdbc:
        time_zone: UTC

server:
  port: 8080

logging:
  level:
    root: INFO